server {
    listen 80;
    listen [::]:80;
    server_name amigonaosecompra.mayradev.me www.amigonaosecompra.mayradev.me api-amigonaosecompra.mayradev.me;
    return 301 https://$host$request_uri;
}

server { 
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amigonaosecompra.mayradev.me www.amigonaosecompra.mayradev.me;

    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    access_log /var/log/nginx/amigo_web_access.log;
    error_log  /var/log/nginx/amigo_web_error.log warn;

    include /etc/nginx/snippets/security.conf;  
    include /etc/nginx/snippets/csp_amigo.conf;

    location / {
        proxy_pass http://amigo_web:80; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api-amigonaosecompra.mayradev.me;

    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    include /etc/nginx/snippets/security.conf;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://amigo_api:80; 
    }
}