map $http_user_agent $bad_bot {
default 0;
~*zgrab 1;
~*masscan 1;
~*nmap 1;
~*nikto 1;
~*sqlmap 1;
~*python-requests 1;
~*libwww-perl 1;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    
    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    server_name _; 
    return 444; 
}

server {
    listen 80;
    listen [::]:80;
    server_name amigonaosecompra.mayradev.me www.amigonaosecompra.mayradev.me;
    return 301 https://$host$request_uri;
}

server { 
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amigonaosecompra.mayradev.me www.amigonaosecompra.mayradev.me;
    
    if ($bad_bot) {
        return 403;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (wp-includes|wp-admin|wp-content|wp-login\.php|xmlrpc\.php) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /nginx.conf {
    deny all;
    }

    location ~* /\.well-known/acme-challenge/.*\.php {
    deny all;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
    }

    location ~* \.(php|cgi|pl|py|env|yml|ini|bak|sql|tar|gz|zip|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }


    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    access_log /var/log/nginx/amigo_web_access.log;
    error_log  /var/log/nginx/amigo_web_error.log warn;

    include /etc/nginx/snippets/security.conf;  
    include /etc/nginx/snippets/csp_amigo.conf;

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://amigo-api:8080;
        proxy_pass $upstream_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        proxy_pass http://amigo-web:80; 
        proxy_pass $upstream_web;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}