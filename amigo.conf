server {
    listen 80;
    listen [::]:80;
    server_name amigonaosecompra.mayradev.me www.amigonaosecompra.mayradev.me;
    return 301 https://$host$request_uri;
}

server { 
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amigonaosecompra.mayradev.me www.amigonaosecompra.mayradev.me;


    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/portfolio_access.log minimal;
    error_log  /var/log/nginx/portfolio_error.log warn;

    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/csp_portfolio.conf;

    # Pegar todos os arquivos hash do vite
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable"; 
        access_log off;
    }

    # Cache das imagens
    location ~* \.(?:ico|png|jpg|jpeg|svg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        limit_except GET HEAD { 
            deny all; 
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}