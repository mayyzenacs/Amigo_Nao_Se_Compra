services:
  amigo-api:
    image: ghcr.io/mayyzenacs/amigo-api:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - main-network

  amigo-web:
    image: ghcr.io/mayyzenacs/amigo-web:latest
    restart: unless-stopped
    depends_on:
      - amigo-api
    networks:
      - main-network

networks:
  main-network:
    external: true
