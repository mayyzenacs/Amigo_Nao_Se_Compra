services:
  amigo-api:
    build:
      context: ./AmigoNcompra_api
    container_name: amigo-api
    restart: always
    env_file:
      - ./AmigoNcompra_api/.env

    volumes:
      - ./data:/app/data
    ports:
      - "5000:8080"

  amigo-web:
    build:
      context: ./AmigoNcompra-web
    container_name: amigo-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./AmigoNcompra-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - amigo-api

networks:
  default:
    name: amigo-network
