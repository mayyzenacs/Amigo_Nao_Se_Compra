services:
  amigo-api:
    image: ghcr.io/mayyzenacs/amigo-api:latest
    container_name: amigo-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - main_network
    healthcheck:
      test: "wget -qO- http://127.0.0.1:8080/health || exit 1"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  amigo-web:
    image: ghcr.io/mayyzenacs/amigo-web:latest
    container_name: amigo-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      amigo-api:
        condition: service_healthy
    networks:
      - main_network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  main_network:
    external: true
