services:
  amigo-api:
    image: ghcr.io/seu-usuario/amigo-api:latest
    container_name: amigo_api_backend
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/${DB_NAME}
    ports:
      - "${API_PORT}:8080"
    volumes:
      - ./database:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
